[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightning-nl2sh"
version = "0.1.0"
description = "Natural language to a shell command, generated for the shell you are actually using."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["requests", "python-dotenv"]

[project.scripts]
lightning-nl2sh = "lightning_nl2sh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lightning_nl2sh"]
