[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightning-nl2sh"
version = "0.1.0"
description = "Natural language to a shell command, generated for the shell you are actually using."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haris" }]
keywords = ["shell", "cli", "llm", "natural-language"]
requires-python = ">=3.9"
dependencies = ["requests", "python-dotenv"]

[project.urls]
Homepage = "https://github.com/haris-a11/lightning-NL2SH"
Issues = "https://github.com/haris-a11/lightning-NL2SH/issues"

[project.scripts]
lightning-nl2sh = "lightning_nl2sh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lightning_nl2sh"]
